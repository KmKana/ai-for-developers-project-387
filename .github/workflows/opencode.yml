name: opencode

# Имя запуска — источник для бюджета: номер PR и автор комментария.
# Бюджет читается из истории запусков, а не из редактируемого комментария.
run-name: opencode / ${{ github.event.issue.number || github.event.pull_request.number }} / ${{ github.event.comment.user.login }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

# Один активный запуск на Issue/PR: у issues и PR общее пространство номеров.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Маршрутизация без секретов: define write-намерение и доверенность PR из форка.
  route:
    if: >-
      github.event.comment.user.login == 'KmKana' &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      write: ${{ steps.access_mode.outputs.write }}
      trusted: ${{ steps.pr_source.outputs.trusted }}
    steps:
      # Write-режимом считается только явный запуск одного из write-навыков.
      # Упоминание навыка в запрете ("не запускай implement-spec") не переключает режим.
      - name: Choose OpenCode access mode
        id: access_mode
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.comment.body.toLowerCase()
            const writeIntent = /(?:^|[\s.,])(?:запусти|запустить|выполни|выполнить|используй|использовать|вызови|вызвать|примени|переходи|перейди|run|use|apply|execute)\s+(?:скилл\s+)?(?:to-spec|to-tickets|implement-spec)\b|\/(?:oc|opencode)\s+(?:to-spec|to-tickets|implement-spec)\b|\/(?:to-spec|to-tickets|implement-spec)\b/i.test(body)
            core.setOutput('write', writeIntent ? 'true' : 'false')

      # Действие OpenCode чекаутит ветку PR, поэтому не передаём секреты в PR из форка.
      - name: Verify pull request is not from a fork
        id: pr_source
        if: github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null
        uses: actions/github-script@v9
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const trusted = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('trusted', trusted ? 'true' : 'false');
            if (!trusted) {
              core.info(`PR #${number} head is in ${pr.head.repo.full_name}; skipping the jobs that use secrets.`);
            }

  # Жёсткий бюджет интерактивных вызовов: не более 3 вызовов модели на PR.
  # Счётчик — история запусков GitHub Actions (run-name содержит номер PR):
  # учитываются повторные запуски и отменённые попытки. Скрипт проверяет бюджет
  # до вызова модели и работает fail-closed. Комментарий с маркером — только
  # уведомление, а не источник счётчика.
  budget:
    needs: route
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      reason: ${{ steps.budget.outputs.reason }}
      used: ${{ steps.budget.outputs.used }}
      limit: ${{ steps.budget.outputs.limit }}
      pr: ${{ steps.budget.outputs.pr }}
      sha: ${{ steps.budget.outputs.sha }}
      logs: ${{ steps.budget.outputs.logs }}
    steps:
      - name: Check out budget script from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce per-PR /oc budget
        id: budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          BUDGET_MODE: interactive
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          MAX_CALLS: "3"
        run: node scripts/opencode-budget.mjs

  # Уведомление о лимите/infra без вызова модели. Для Issues и PR без лимита
  # job пропускается. Повторные уведомления по одному PR не публикуются.
  budget-notice:
    needs: [route, budget]
    if: needs.route.outputs.trusted != 'false' && needs.budget.outputs.allowed != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Publish budget status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.budget.outputs.pr }}
          SHA: ${{ needs.budget.outputs.sha }}
          REASON: ${{ needs.budget.outputs.reason }}
          USED: ${{ needs.budget.outputs.used }}
          LIMIT: ${{ needs.budget.outputs.limit }}
          LOGS: ${{ needs.budget.outputs.logs }}
        run: |
          if [ -z "$PR" ]; then exit 0; fi
          if ! gh pr view "$PR" --json number >/dev/null 2>&1; then
            echo "Target #$PR is not a pull request; no PR budget notice."
            exit 0
          fi
          if [ "$REASON" = "limit_exhausted" ]; then
            marker="budget_status: limit_exhausted"
            title="Бюджет интерактивных вызовов /oc исчерпан"
            detail="Учитываются повторные и отменённые запуски; новый вызов модели не выполнялся. Чтобы получить новый бюджет, откройте новый PR."
          else
            marker="budget_status: infra_failed"
            title="Не удалось проверить бюджет вызовов /oc"
            detail="Модель не вызывалась. Проверьте логи и повторите после исправления причины."
          fi
          if gh pr view "$PR" --json comments --jq '.comments[].body' 2>/dev/null | grep -Fq "$marker"; then
            echo "Budget notice already present: $marker"
            exit 0
          fi
          {
            printf '%s\n' '> *This message was generated by the OpenCode budget guard, not by the model.*'
            printf '\n`%s`\n\n' "$marker"
            printf 'PR #%s: %s.\n' "$PR" "$title"
            printf 'Использовано: %s из %s.\n' "$USED" "$LIMIT"
            printf 'Head SHA: %s\n' "$SHA"
            printf '[Логи запуска](%s)\n\n' "$LOGS"
            printf '%s\n' "$detail"
            printf '%s\n' 'Автоматические исправления не запускаются.'
          } > budget-notice.md
          gh pr comment "$PR" --body-file budget-notice.md

  # Обычные комментарии: explain, triage, анализ требований. Право write на Issues не выдаётся.
  opencode-readonly:
    needs: [route, budget]
    if: needs.route.outputs.write != 'true' && needs.route.outputs.trusted != 'false' && needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # OpenCode находит .agents/skills автоматически (project compatibility path).
      - name: Verify OpenCode configuration and skills
        run: |
          test -f opencode.json
          test -f opencode.readonly.json
          test -f docs/agents/opencode-github.md
          node -e "const fs=require('fs');for(const file of ['opencode.json','opencode.readonly.json']){const c=JSON.parse(fs.readFileSync(file,'utf8'));if(c['\$schema']!=='https://opencode.ai/config.json')throw new Error(file+' is missing \$schema');for(const f of c.instructions||[]){if(!fs.existsSync(f))throw new Error('missing instruction file: '+f)}}const c=JSON.parse(fs.readFileSync('opencode.json','utf8'));const a=c.agent&&c.agent.readonly;if(!a||a.mode!=='primary'||!a.permission||a.permission.edit!=='deny'||a.permission.bash!=='deny'||a.permission.task!=='deny')throw new Error('read-only agent is not configured')"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('opencode.readonly.json','utf8'));if(c.default_agent!=='readonly')throw new Error('read-only config must use default_agent: readonly');for(const p of ['edit','bash','task','webfetch','websearch','todowrite','lsp','question'])if(c.permission[p]!=='deny')throw new Error('missing read-only deny for '+p);if(JSON.stringify(c.permission.external_directory)!=='{\"*\":\"deny\"}')throw new Error('external_directory must be denied')"
          test -f .agents/skills/to-spec/SKILL.md
          test -f .agents/skills/to-tickets/SKILL.md
          test -f .agents/skills/implement-spec/SKILL.md
          echo "OpenCode config, instructions and agent skills are available"

      - name: Build read-only inline config
        id: readonly_config
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const config = JSON.parse(fs.readFileSync('opencode.readonly.json', 'utf8'))
            if (config.default_agent !== 'readonly') throw new Error('default_agent must be readonly')
            core.setOutput('config', JSON.stringify(config))

      - name: Verify clean worktree before OpenCode
        run: |
          test -z "$(git status --porcelain)"

      # Платная модель требует ключ Workspace OpenCode Console. Без секрета job
      # падает сразу, а не после таймаута на ошибке провайдера.
      - name: Verify OPENCODE_API_KEY is configured
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.SECRETPAY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Repository secret OPENCODE_API_KEY is not configured. Add a key from the OpenCode Console workspace with a positive balance."
            exit 1
          fi

      # Авторизация OpenCode по-прежнему через GitHub App (OIDC). GH_TOKEN не передаётся.
      - name: Run OpenCode
        uses: ./.github/actions/opencode-pinned
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.SECRETPAY }}
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: /opencode,/oc
          share: false
          config_content: ${{ steps.readonly_config.outputs.config }}

      # Экшн сам коммитит грязное дерево и открывает PR. Для read-only это недопустимо.
      - name: Verify read-only run left the worktree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "OpenCode changed files in read-only mode"
            git status --short
            git reset --hard HEAD
            git clean -fd
            exit 1
          fi

  # Явные to-spec, to-tickets и implement-spec: отдельный job с issues: write.
  # GH_TOKEN нужен только agent'у внутри запуска (для gh), авторизация самого
  # OpenCode GitHub Action остаётся на GitHub App через OIDC.
  opencode-write:
    needs: [route, budget]
    if: needs.route.outputs.write == 'true' && needs.route.outputs.trusted != 'false' && needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify OpenCode configuration and skills
        run: |
          test -f opencode.json
          test -f opencode.readonly.json
          test -f docs/agents/opencode-github.md
          node -e "const fs=require('fs');for(const file of ['opencode.json','opencode.readonly.json']){const c=JSON.parse(fs.readFileSync(file,'utf8'));if(c['\$schema']!=='https://opencode.ai/config.json')throw new Error(file+' is missing \$schema');for(const f of c.instructions||[]){if(!fs.existsSync(f))throw new Error('missing instruction file: '+f)}}const c=JSON.parse(fs.readFileSync('opencode.json','utf8'));const a=c.agent&&c.agent.readonly;if(!a||a.mode!=='primary'||!a.permission||a.permission.edit!=='deny'||a.permission.bash!=='deny'||a.permission.task!=='deny')throw new Error('read-only agent is not configured')"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('opencode.readonly.json','utf8'));if(c.default_agent!=='readonly')throw new Error('read-only config must use default_agent: readonly');for(const p of ['edit','bash','task','webfetch','websearch','todowrite','lsp','question'])if(c.permission[p]!=='deny')throw new Error('missing read-only deny for '+p);if(JSON.stringify(c.permission.external_directory)!=='{\"*\":\"deny\"}')throw new Error('external_directory must be denied')"
          test -f .agents/skills/to-spec/SKILL.md
          test -f .agents/skills/to-tickets/SKILL.md
          test -f .agents/skills/implement-spec/SKILL.md
          echo "OpenCode config, instructions and agent skills are available"

      - name: Verify clean worktree before OpenCode
        run: |
          test -z "$(git status --porcelain)"

      - name: Verify GitHub CLI authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN"
          gh auth status

      - name: Verify OPENCODE_API_KEY is configured
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.SECRETPAY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Repository secret OPENCODE_API_KEY is not configured. Add a key from the OpenCode Console workspace with a positive balance."
            exit 1
          fi

      - name: Run OpenCode
        uses: ./.github/actions/opencode-pinned
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.SECRETPAY }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: /opencode,/oc
          share: false
          gh_token: ${{ github.token }}
