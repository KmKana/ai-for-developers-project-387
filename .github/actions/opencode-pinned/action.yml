name: "opencode GitHub Action (pinned)"
description: "Run opencode in GitHub Actions with a pinned CLI version"

# Computed from anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a.
# The upstream composite action caches by the latest release tag and can skip the
# install step, so the installer is invoked here with an explicit version instead.

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent input kept for parity with the upstream action"
    required: false

  share:
    description: "Share the opencode session"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of OpenCode App token exchange"
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API"
    required: false

  config_content:
    description: "Inline OpenCode config, e.g. the read-only override"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install pinned OpenCode
      shell: bash
      run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.6

    - name: Verify pinned OpenCode version
      shell: bash
      run: |
        version="$("$HOME/.opencode/bin/opencode" --version)"
        echo "OpenCode version: $version"
        test "$version" = "1.19.6"

    - name: Add opencode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

    - name: Run opencode
      shell: bash
      run: opencode github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        OPENCODE_CONFIG_CONTENT: ${{ inputs.config_content }}
